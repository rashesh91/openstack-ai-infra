---
# Kolla-Ansible globals.yml — GPU-enabled OpenStack for AI/ML workloads
# Extends openstack-kolla-deploy with GPU passthrough + Ironic bare metal

kolla_base_distro: "ubuntu"
kolla_install_type: "source"
openstack_release: "2024.1"
kolla_internal_vip_address: "10.0.1.100"
kolla_external_vip_address: "203.0.113.10"

# ── Network ───────────────────────────────────────────────────────────────────
network_interface: "eno1"
neutron_external_interface: "eno2"
storage_interface: "eno3"
cluster_interface: "eno4"
# AI training network — high-MTU VLAN for distributed training (NCCL/RDMA)
# Corresponds to physnet-ai provider on VLAN 200
neutron_ml2_drivers_type: "flat,vlan,vxlan"

# ── Core services (same as openstack-kolla-deploy) ────────────────────────────
enable_keystone: "yes"
enable_nova: "yes"
enable_neutron: "yes"
enable_glance: "yes"
enable_cinder: "yes"
enable_horizon: "yes"
enable_heat: "yes"
enable_barbican: "yes"
enable_haproxy: "yes"
enable_keepalived: "yes"
enable_prometheus: "yes"
enable_grafana: "yes"

# ── Ironic — bare metal provisioning for GPU nodes ────────────────────────────
enable_ironic: "yes"
enable_ironic_ipxe: "yes"
# IPMI network for out-of-band management
ironic_cleaning_network: "baremetal-cleaning"
ironic_provisioning_network: "baremetal-provisioning"

# ── Nova GPU passthrough ──────────────────────────────────────────────────────
# PCI device aliases defined in config/nova/nova.conf
# GPU compute nodes require IOMMU enabled (see scripts/setup-gpu-passthrough.sh)
nova_compute_virt_type: "kvm"

# ── Neutron ───────────────────────────────────────────────────────────────────
neutron_plugin_agent: "openvswitch"
neutron_tenant_network_types: "vxlan"
enable_neutron_qos: "yes"       # QoS for guaranteed bandwidth on AI network

# ── Ceph (shared with kolla-deploy cluster) ───────────────────────────────────
enable_ceph: "yes"
cinder_backend_ceph: "yes"
glance_backend_ceph: "yes"
