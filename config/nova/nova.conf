# Nova configuration for GPU PCI passthrough
# Place this file at: config/nova/nova.conf
# Kolla-Ansible merges this with the base nova.conf on all nova-compute nodes.
# Author: rasheshpatel <rasheshkumar.patel@gmail.com>

[DEFAULT]
# Reserve 4 GB host memory for hypervisor OS, not overcommitted to guests
reserved_host_memory_mb = 4096

# No overcommit for GPU nodes — 1:1 ratios ensure predictable performance
cpu_allocation_ratio = 1.0
ram_allocation_ratio = 1.0
disk_allocation_ratio = 1.0

# Restore guest power state after host reboot
resume_guests_state_on_host_boot = true

# Live migration transport
live_migration_permit_post_copy = true

[pci]
# NVIDIA A100 SXM4 80GB — PCI vendor:product 10de:20b5
alias = {"name": "nvidia-a100", "vendor_id": "10de", "product_id": "20b5", "device_type": "type-PF"}

# NVIDIA T4 — PCI vendor:product 10de:1eb8
alias = {"name": "nvidia-t4", "vendor_id": "10de", "product_id": "1eb8", "device_type": "type-PF"}

# Passthrough whitelist: expose both GPU types to Nova scheduler
passthrough_whitelist = {"vendor_id": "10de", "product_id": "20b5"}
passthrough_whitelist = {"vendor_id": "10de", "product_id": "1eb8"}

[filter_scheduler]
# PCI + NUMA-aware scheduling filters for GPU workloads
enabled_filters = PciPassthroughFilter,NUMATopologyFilter,AggregateInstanceExtraSpecsFilter,ComputeFilter,ComputeCapabilitiesFilter,AvailabilityZoneFilter,ImagePropertiesFilter

[libvirt]
# Pass host CPU features directly into guest (required for GPU passthrough performance)
cpu_mode = host-passthrough

# Q35 machine type required for PCIe bus (GPU passthrough)
hw_machine_type = x86_64=q35

# SSH-based live migration
live_migration_scheme = ssh
live_migration_uri = qemu+ssh://nova@%s/system

# IOMMU device model (virtio for paravirtual NICs/disks, vfio for GPU)
iommu_model = auto

[vnc]
enabled = true
server_listen = 0.0.0.0
server_proxyclient_address = $my_ip
novncproxy_base_url = http://10.0.1.100:6080/vnc_lite.html

[spice]
enabled = false

[serial_console]
enabled = true
base_url = ws://10.0.1.100:6083/

[cache]
enabled = true
backend = oslo_cache.backends.memcache
memcache_servers = 10.0.1.11:11211,10.0.1.12:11211,10.0.1.13:11211
